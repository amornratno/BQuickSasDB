<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-Quik Training Evaluation Report - The Quick Recovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bq-yellow: #FFD100;
      --bq-yellow-hover: #F5C400;
      --bq-yellow-soft: #FEFCE8;
      --bq-yellow-border: #FDE047;
      --bq-black: #141416;
      --bq-charcoal: #222226;
      --bq-bg: #F6F6F7;
      --bq-card: #FFFFFF;
      --bq-text: #141416;
      --bq-sub: #52525B;
      --bq-muted: #71717A;
      --bq-border: #E4E4E7;
      --green: #16A34A;
      --green-soft: #F0FDF4;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bq-bg);
      color: var(--bq-text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= TOP HEADER (ธีมเหลือง-ดำ Minimal บนหน้าจอเว็บ) ================= */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bq-black);
      color: #FFFFFF;
      border-bottom: 3px solid var(--bq-yellow);
    }

    .nav-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: var(--bq-yellow);
      color: var(--bq-black);
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 5px;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 15.5px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .brand-sub {
      font-size: 12px;
      color: #A1A1AA;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 7px;
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-dark-ghost {
      background: rgba(255, 255, 255, 0.08);
      color: #E4E4E7;
      border-color: rgba(255, 255, 255, 0.14);
    }
    .btn-dark-ghost:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
    }

    .btn-outline-yellow {
      background: transparent;
      color: var(--bq-yellow);
      border-color: var(--bq-yellow);
    }
    .btn-outline-yellow:hover {
      background: rgba(255, 209, 0, 0.12);
    }

    .btn-yellow {
      background: var(--bq-yellow);
      color: var(--bq-black);
    }
    .btn-yellow:hover {
      background: var(--bq-yellow-hover);
    }

    /* ================= COHORT TABS BAR ================= */
    .tabs-bar-bg {
      background: var(--bq-charcoal);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tabs-strip {
      max-width: 1220px;
      margin: 0 auto;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .pill-tab {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      padding: 6px 14px;
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #D4D4D8;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .pill-tab:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }

    .pill-tab.active {
      background: var(--bq-yellow);
      color: var(--bq-black);
      border-color: var(--bq-yellow);
      font-weight: 700;
    }

    .pill-tab .tab-meta {
      font-size: 11.5px;
      font-weight: 400;
      opacity: 0.82;
    }

    .latest-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22C55E;
    }
    .pill-tab.active .latest-dot {
      background: var(--bq-black);
    }

    /* ================= MAIN CONTAINER ================= */
    .container {
      max-width: 1220px;
      margin: 24px auto 60px auto;
      padding: 0 24px;
    }

    /* Loading Spinner */
    .loading-box {
      background: #FFFFFF;
      border: 1px solid var(--bq-border);
      border-radius: 14px;
      padding: 60px 24px;
      text-align: center;
      color: var(--bq-sub);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3.5px solid #E4E4E7;
      border-top-color: var(--bq-yellow);
      border-right-color: var(--bq-black);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ================= FORMAL PDF DOCUMENT HEADER & FOOTER (แสดงเฉพาะตอนพิมพ์ PDF) ================= */
    .formal-pdf-header,
    .formal-pdf-footer {
      display: none;
    }

    /* ================= COMPACT OVERALL BENCHMARK BAR ================= */
    .benchmark-card {
      background: var(--bq-card);
      border: 1px solid var(--bq-border);
      border-left: 5px solid var(--bq-yellow);
      border-radius: 12px;
      padding: 16px 22px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 245px 1fr;
      gap: 24px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .bm-summary {
      border-right: 1px solid var(--bq-border);
      padding-right: 20px;
    }

    .bm-eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--bq-muted);
      letter-spacing: 0.3px;
    }

    .bm-big-score {
      font-size: 32px;
      font-weight: 800;
      color: var(--bq-black);
      line-height: 1.15;
      margin: 2px 0;
    }

    .bm-big-score span {
      font-size: 14px;
      font-weight: 500;
      color: var(--bq-muted);
    }

    .bm-subtext {
      font-size: 12.5px;
      color: var(--bq-sub);
    }

    .bm-chart-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .bm-chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--bq-sub);
    }

    .bm-bars-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .bm-col-item {
      flex: 1 0 125px;
      background: #FAFAFA;
      border: 1px solid var(--bq-border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .bm-col-item:hover {
      border-color: #A1A1AA;
      background: #F4F4F5;
    }

    .bm-col-item.is-selected {
      background: var(--bq-black);
      border-color: var(--bq-black);
      color: #FFFFFF;
    }

    .bm-col-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }

    .bm-col-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--bq-sub);
    }

    .bm-col-item.is-selected .bm-col-name {
      color: var(--bq-yellow);
      font-weight: 700;
    }

    .bm-col-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--bq-black);
    }

    .bm-col-item.is-selected .bm-col-val {
      color: #FFFFFF;
    }

    .bm-mini-track {
      height: 5px;
      background: #E4E4E7;
      border-radius: 99px;
      overflow: hidden;
    }

    .bm-col-item.is-selected .bm-mini-track {
      background: rgba(255, 255, 255, 0.2);
    }

    .bm-mini-fill {
      height: 100%;
      background: #71717A;
      border-radius: 99px;
    }

    .bm-col-item.is-selected .bm-mini-fill {
      background: var(--bq-yellow);
    }

    /* ================= COHORT HEADER & 4 KPI BOXES ================= */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--bq-black);
    }

    .section-header .date-sub {
      font-size: 13.5px;
      color: var(--bq-sub);
      margin-top: 2px;
    }

    .respondent-pill {
      background: var(--bq-black);
      color: var(--bq-yellow);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .kpi-box {
      background: var(--bq-card);
      border: 1px solid var(--bq-border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .kpi-box.featured {
      background: var(--bq-yellow-soft);
      border-color: var(--bq-yellow);
      border-width: 1.5px;
    }

    .kpi-title {
      font-size: 12.5px;
      color: var(--bq-sub);
      font-weight: 600;
    }

    .kpi-number-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 6px 0 4px 0;
    }

    .kpi-number {
      font-size: 26px;
      font-weight: 800;
      color: var(--bq-black);
      line-height: 1.1;
    }

    .kpi-foot {
      font-size: 12px;
      color: var(--bq-muted);
    }

    .tag-diff {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .tag-pos { background: var(--green-soft); color: var(--green); }
    .tag-neg { background: #FEF2F2; color: #DC2626; }
    .tag-neu { background: #F4F4F5; color: var(--bq-sub); }

    /* ================= 2-COLUMN DIMENSION CARDS ================= */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--bq-card);
      border: 1px solid var(--bq-border);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 18px;
    }

    .grid-2col .card {
      margin-bottom: 0;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #F4F4F5;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--bq-black);
    }

    .card-avg {
      font-size: 13px;
      font-weight: 700;
      color: var(--bq-yellow);
      background: var(--bq-black);
      padding: 3px 11px;
      border-radius: 8px;
    }

    .metric-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .metric-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 5px;
    }

    .metric-label {
      font-size: 13.5px;
      color: var(--bq-text);
      font-weight: 500;
    }

    .metric-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--bq-black);
      white-space: nowrap;
    }

    .metric-val small {
      font-weight: 400;
      color: var(--bq-muted);
      font-size: 11.5px;
    }

    .clean-track {
      position: relative;
      height: 7px;
      background: #F4F4F5;
      border-radius: 99px;
      overflow: hidden;
    }

    .clean-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #141416 0%, #EAB308 100%);
    }

    .benchmark-pin {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2.5px;
      background: #DC2626;
      z-index: 2;
    }

    .prepost-minimal {
      margin-top: 16px;
      padding: 12px 14px;
      background: var(--bq-yellow-soft);
      border: 1px solid var(--bq-yellow-border);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--bq-black);
    }

    .mod-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mod-top {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      margin-bottom: 4px;
    }

    .mod-rank {
      display: inline-block;
      min-width: 20px;
      color: var(--bq-black);
      font-weight: 800;
      margin-right: 4px;
    }

    .qual-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .qual-col {
      background: #FAFAFA;
      border: 1px solid #F4F4F5;
      border-radius: 10px;
      padding: 14px;
    }

    .qual-col h4 {
      margin: 0 0 10px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--bq-black);
    }

    .comment-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: #FFFFFF;
      border: 1px solid var(--bq-border);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 12px;
      color: var(--bq-sub);
    }

    .chip.hidden-chip {
      display: none;
    }

    .qual-col.expanded .chip.hidden-chip {
      display: inline-block;
    }

    .toggle-more-btn {
      margin-top: 8px;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #B45309;
      cursor: pointer;
    }

    .print-only-more-note {
      display: none;
    }

    .print-all-only {
      display: none;
    }

    .cohort-section.page-break-before {
      page-break-before: always;
      break-before: page;
    }

    @media (max-width: 960px) {
      .benchmark-card,
      .kpi-row,
      .grid-2col,
      .qual-cols {
        grid-template-columns: 1fr;
      }
      .bm-summary {
        border-right: none;
        border-bottom: 1px solid var(--bq-border);
        padding-right: 0;
        padding-bottom: 12px;
      }
    }

    /* ================= FORMAL EXECUTIVE A4 PRINT STYLES (ไม่เกิน 2 หน้าต่อรุ่น) ================= */
    @page {
      size: A4 portrait;
      margin: 9mm 11mm 10mm 11mm;
    }

    @media print {
      body {
        background: #FFFFFF !important;
        font-size: 10.5px !important;
        line-height: 1.4 !important;
      }

      .top-nav,
      .no-print,
      .benchmark-cohort-only-screen,
      .toggle-more-btn,
      .section-header,
      .chip.hidden-chip {
        display: none !important;
      }

      .print-only-more-note {
        display: block !important;
        margin-top: 5px;
        font-size: 9.5px;
        font-weight: 600;
        color: #B45309;
      }

      .formal-pdf-header {
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        margin-bottom: 10px;
        background: #FFFFFF;
        border: 1.5px solid var(--bq-black);
        border-top: 5px solid var(--bq-yellow);
        border-radius: 8px;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .fph-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .fph-logo-box {
        width: 72px;
        height: 40px;
        border-radius: 6px;
        overflow: hidden;
        background: var(--bq-yellow);
        border: 1px solid #E4E4E7;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .fph-logo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .fph-logo-fallback {
        display: none;
        font-weight: 800;
        font-size: 14px;
        color: var(--bq-black);
        letter-spacing: 0.3px;
      }

      .fph-kicker {
        font-size: 10px;
        font-weight: 700;
        color: #71717A;
        letter-spacing: 0.3px;
        line-height: 1.2;
      }

      .fph-title {
        font-size: 14.5px;
        font-weight: 800;
        color: var(--bq-black);
        letter-spacing: 0.2px;
        line-height: 1.25;
        margin-top: 1px;
      }

      .fph-subtitle {
        font-size: 10.5px;
        color: var(--bq-sub);
        margin-top: 1px;
      }

      .fph-right {
        text-align: right;
        border-left: 1px solid #E4E4E7;
        padding-left: 12px;
        flex-shrink: 0;
      }

      .fph-scope-pill {
        display: inline-block;
        background: var(--bq-black);
        color: var(--bq-yellow);
        font-weight: 700;
        font-size: 10.5px;
        padding: 3px 10px;
        border-radius: 5px;
        margin-bottom: 3px;
      }

      .fph-meta {
        font-size: 9.5px;
        color: var(--bq-sub);
      }

      .formal-pdf-footer {
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        padding-top: 5px;
        border-top: 1px solid #D4D4D8;
        font-size: 9.5px;
        color: var(--bq-muted);
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .benchmark-card {
        padding: 9px 12px !important;
        margin-bottom: 9px !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .bm-bars-row {
        flex-wrap: wrap !important;
        overflow: visible !important;
        gap: 6px !important;
      }

      .bm-col-item {
        padding: 5px 8px !important;
      }

      .kpi-row {
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 7px !important;
        margin-bottom: 9px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .kpi-box {
        padding: 7px 10px !important;
        border-radius: 7px !important;
      }
      .kpi-title {
        font-size: 10.5px !important;
      }
      .kpi-number {
        font-size: 17px !important;
      }
      .kpi-foot {
        font-size: 10px !important;
      }

      .grid-2col {
        grid-template-columns: 1fr 1fr !important;
        gap: 8px !important;
        margin-bottom: 8px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .qual-cols {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 7px !important;
      }

      .card {
        padding: 9px 11px !important;
        margin-bottom: 8px !important;
        border-radius: 8px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .card-head {
        margin-bottom: 7px !important;
        padding-bottom: 5px !important;
      }

      .card-title {
        font-size: 12px !important;
      }

      .card-avg {
        font-size: 11px !important;
        padding: 2px 8px !important;
      }

      .metric-list {
        gap: 6px !important;
      }

      .metric-top {
        margin-bottom: 3px !important;
      }

      .metric-label {
        font-size: 10px !important;
      }

      .metric-val {
        font-size: 11px !important;
      }

      .clean-track {
        height: 5px !important;
      }

      .prepost-minimal {
        margin-top: 8px !important;
        padding: 6px 10px !important;
        font-size: 10.5px !important;
      }

      .mod-list {
        gap: 5px !important;
      }

      .mod-top {
        font-size: 10.5px !important;
        margin-bottom: 2px !important;
      }

      .qual-col {
        padding: 7px 9px !important;
      }

      .qual-col h4 {
        margin-bottom: 6px !important;
        font-size: 11px !important;
      }

      .comment-chips {
        gap: 4px !important;
      }

      .chip {
        font-size: 9.5px !important;
        padding: 2px 6px !important;
      }

      body.print-mode-all .single-tab-view {
        display: none !important;
      }

      body.print-mode-all .print-all-only {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <!-- แถบนำทางธีมเหลือง-ดำ (แสดงบนหน้าจอเว็บ) -->
  <header class="top-nav no-print">
    <div class="nav-inner">
      <div class="brand-group">
        <span class="brand-badge">B-QUIK</span>
        <div>
          <div class="brand-title" id="navCourseTitle">The Quick Recovery • Evaluation Report</div>
          <div class="brand-sub" id="navSubMeta">กำลังเชื่อมต่อฐานข้อมูล Google Sheet...</div>
        </div>
      </div>

      <div class="nav-actions">
        <button class="btn btn-dark-ghost" id="btnRefresh" onclick="fetchReportDataFromAppsScript()">🔄 อัปเดตข้อมูล</button>
        <button class="btn btn-outline-yellow" id="btnPrintCurrent" onclick="printCurrentTabPdf()">🖨️ เซฟ PDF รุ่นนี้ (A4)</button>
        <button class="btn btn-yellow" onclick="printAllCohortsPdf()">📚 เซฟ PDF รวมทุกรุ่น (A4)</button>
      </div>
    </div>

    <div class="tabs-bar-bg">
      <div class="tabs-strip" id="cohortTabsBar"></div>
    </div>
  </header>

  <!-- พื้นที่เนื้อหารายงาน -->
  <main class="container">
    <div id="singleTabContainer" class="single-tab-view">
      <div class="loading-box">
        <div class="spinner"></div>
        <div style="font-weight:700; font-size:15px; color:#141416;">กำลังดึงข้อมูลผลการประเมินจาก Google Sheet...</div>
        <div style="font-size:12.5px; margin-top:4px;">โปรดรอสักครู่ ระบบกำลังประมวลผลข้อมูลล่าสุด</div>
      </div>
    </div>

    <div id="allCohortsPrintContainer" class="print-all-only"></div>
  </main>

  <script>
    // =========================================================================
    // ตั้งค่า URL ของ Google Apps Script Web App (/exec) ที่ทำหน้าที่เป็น Database API
    // =========================================================================
    const APPS_SCRIPT_API_URL = 'https://script.google.com/macros/s/AKfycbwDwBHBEfzD9XMg6_5yJh3AmCNPplHEXMp31qm66PWs07nnVSTwHTwTIETb36058dp2zw/exec';
    const BQUIK_LOGO_URL = 'https://minio.aiitworks.tech/datahub/branches/242/e60c180f-76f4-4f1d-99b2-585b3e27f783.webp';

    let REPORT_DATA = null;
    let ACTIVE_TAB_ID = null;

    window.addEventListener('DOMContentLoaded', () => {
      fetchReportDataFromAppsScript();
    });

    /**
     * ดึงข้อมูล JSON สดจาก Google Apps Script URL (รองรับทั้ง fetch และ JSONP fallback)
     */
    async function fetchReportDataFromAppsScript() {
      const btn = document.getElementById('btnRefresh');
      const container = document.getElementById('singleTabContainer');

      if (btn) btn.textContent = '⏳ กำลังซิงค์...';
      if (!REPORT_DATA) {
        container.innerHTML = `
          <div class="loading-box">
            <div class="spinner"></div>
            <div style="font-weight:700; font-size:15px; color:#141416;">กำลังเชื่อมต่อฐานข้อมูล Google Sheet...</div>
            <div style="font-size:12.5px; margin-top:4px;">กำลังซิงค์ข้อมูลล่าสุดผ่าน Apps Script API</div>
          </div>
        `;
      }

      try {
        const cacheBusterUrl = `${APPS_SCRIPT_API_URL}?t=${Date.now()}`;
        const response = await fetch(cacheBusterUrl, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}`);
        }

        const data = await response.json();
        handleLoadedData(data);
      } catch (fetchErr) {
        // Fallback ผ่าน JSONP กรณีเปิดไฟล์ html แบบ local (file://) หรือเครือข่ายบล็อก CORS redirect
        fetchViaJsonp(APPS_SCRIPT_API_URL)
          .then(data => handleLoadedData(data))
          .catch(jsonpErr => {
            if (btn) btn.textContent = '🔄 อัปเดตข้อมูล';
            container.innerHTML = `
              <div class="loading-box" style="border-color:#FCA5A5;">
                <div style="font-weight:800; font-size:16px; color:#DC2626; margin-bottom:6px;">ไม่สามารถเชื่อมต่อฐานข้อมูล Google Sheet ได้</div>
                <div style="font-size:13px; color:#52525B; max-width:560px; margin:0 auto;">
                  กรุณาตรวจสอบว่าได้กด <strong>Deploy > Manage deployments > New version</strong> ใน Apps Script และตั้งค่าสิทธิ์เข้าถึงเป็น <strong>Anyone (ทุกคน)</strong> แล้ว
                </div>
                <button class="btn btn-yellow" style="margin-top:16px;" onclick="fetchReportDataFromAppsScript()">ลองเชื่อมต่อใหม่อีกครั้ง</button>
              </div>
            `;
          });
      }
    }

    function fetchViaJsonp(baseUrl) {
      return new Promise((resolve, reject) => {
        const callbackName = 'bqCallback_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');

        const cleanup = () => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('JSONP Timeout'));
        }, 15000);

        window[callbackName] = (data) => {
          clearTimeout(timer);
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          clearTimeout(timer);
          cleanup();
          reject(new Error('JSONP Script Error'));
        };

        script.src = `${baseUrl}?callback=${callbackName}&t=${Date.now()}`;
        document.body.appendChild(script);
      });
    }

    function handleLoadedData(data) {
      const btn = document.getElementById('btnRefresh');
      if (btn) btn.textContent = '🔄 อัปเดตข้อมูล';

      if (!data || data.error) {
        document.getElementById('singleTabContainer').innerHTML =
          `<div class="loading-box" style="color:#DC2626;">${data ? escapeHtml(data.error) : 'ไม่พบข้อมูล'}</div>`;
        return;
      }

      REPORT_DATA = data;
      const exists = (ACTIVE_TAB_ID === 'OVERALL') || REPORT_DATA.cohorts.some(c => c.id === ACTIVE_TAB_ID);
      if (!exists) {
        ACTIVE_TAB_ID = REPORT_DATA.cohorts.length > 0 ? REPORT_DATA.cohorts[0].id : 'OVERALL';
      }

      buildTabsBar();
      renderActiveTab();
      renderAllCohortsForPrint();
    }

    function buildTabsBar() {
      const tabsBar = document.getElementById('cohortTabsBar');
      if (!REPORT_DATA || REPORT_DATA.error) {
        tabsBar.innerHTML = '';
        return;
      }

      document.getElementById('navCourseTitle').textContent =
        `${REPORT_DATA.meta.organization} • ${REPORT_DATA.meta.courseTitle}`;
      document.getElementById('navSubMeta').textContent =
        `ช่วงอบรม ${REPORT_DATA.meta.dateRangeText} • ผู้ประเมิน ${REPORT_DATA.meta.totalResponses} คน (${REPORT_DATA.meta.totalCohorts} รุ่น) • อัปเดต ${REPORT_DATA.meta.generatedAt}`;

      let html = '';
      const totalCohorts = REPORT_DATA.cohorts.length;

      REPORT_DATA.cohorts.forEach((c, idx) => {
        const isActive = (ACTIVE_TAB_ID === c.id) ? 'active' : '';
        const isLatest = (idx === totalCohorts - 1);
        html += `
          <button class="pill-tab ${isActive}" onclick="selectTab('${c.id}')" title="${isLatest ? 'รุ่นล่าสุด' : ''}">
            ${isLatest ? '<span class="latest-dot"></span>' : ''}
            <span>${escapeHtml(c.tabShortTitle)}</span>
            <span class="tab-meta">(${c.dateLabel})</span>
          </button>
        `;
      });

      const isOvActive = (ACTIVE_TAB_ID === 'OVERALL') ? 'active' : '';
      html += `
        <button class="pill-tab ${isOvActive}" onclick="selectTab('OVERALL')">
          <span>📊 ภาพรวมทุกรุ่น</span>
          <span class="tab-meta">(${REPORT_DATA.overall.respondents} คน)</span>
        </button>
      `;

      tabsBar.innerHTML = html;
      updatePrintButtonLabel();
    }

    function selectTab(tabId) {
      ACTIVE_TAB_ID = tabId;
      buildTabsBar();
      renderActiveTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updatePrintButtonLabel() {
      const btn = document.getElementById('btnPrintCurrent');
      if (!btn || !REPORT_DATA || REPORT_DATA.error) return;

      if (ACTIVE_TAB_ID === 'OVERALL') {
        btn.innerHTML = '🖨️ เซฟ PDF ภาพรวม (A4)';
      } else {
        const target = REPORT_DATA.cohorts.find(c => c.id === ACTIVE_TAB_ID);
        const label = target ? target.tabShortTitle : 'รุ่นนี้';
        btn.innerHTML = `🖨️ เซฟ PDF ${label} (A4)`;
      }
    }

    function renderActiveTab() {
      const container = document.getElementById('singleTabContainer');
      if (!REPORT_DATA || REPORT_DATA.error) return;

      const isOverallTab = (ACTIVE_TAB_ID === 'OVERALL');
      if (isOverallTab) {
        let html = buildFormalPdfHeader(REPORT_DATA.overall, true);
        html += buildCompactBenchmarkBar('OVERALL', false);
        html += buildCohortBodyHTML(REPORT_DATA.overall, true);
        html += buildFormalPdfFooter();
        container.innerHTML = html;
      } else {
        const targetCohort = REPORT_DATA.cohorts.find(c => c.id === ACTIVE_TAB_ID);
        if (targetCohort) {
          let html = buildFormalPdfHeader(targetCohort, false);
          html += buildCompactBenchmarkBar(ACTIVE_TAB_ID, true);
          html += buildCohortBodyHTML(targetCohort, false);
          html += buildFormalPdfFooter();
          container.innerHTML = html;
        }
      }
    }

    function renderAllCohortsForPrint() {
      const allContainer = document.getElementById('allCohortsPrintContainer');
      if (!REPORT_DATA || REPORT_DATA.error) return;

      let html = `<div>`;
      html += buildFormalPdfHeader(REPORT_DATA.overall, true);
      html += buildCompactBenchmarkBar('OVERALL', false);
      html += buildCohortBodyHTML(REPORT_DATA.overall, true);
      html += buildFormalPdfFooter();
      html += `</div>`;

      REPORT_DATA.cohorts.forEach(cohort => {
        html += `<div class="cohort-section page-break-before">`;
        html += buildFormalPdfHeader(cohort, false);
        html += buildCohortBodyHTML(cohort, false);
        html += buildFormalPdfFooter();
        html += `</div>`;
      });

      allContainer.innerHTML = html;
    }

    function printCurrentTabPdf() {
      document.body.classList.remove('print-mode-all');
      window.print();
    }

    function printAllCohortsPdf() {
      document.body.classList.add('print-mode-all');
      window.print();
    }

    window.addEventListener('afterprint', () => {
      document.body.classList.remove('print-mode-all');
    });

    function buildFormalPdfHeader(sec, isOverall) {
      const m = REPORT_DATA.meta;
      const scopeText = isOverall
        ? `ภาพรวมทั้งหมด (${m.totalCohorts} รุ่น)`
        : `${sec.badgeTitle} | ${sec.dateLabel}`;

      return `
        <div class="formal-pdf-header">
          <div class="fph-left">
            <div class="fph-logo-box">
              <img class="fph-logo-img" src="${BQUIK_LOGO_URL}" alt="B-Quik Logo"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
              <span class="fph-logo-fallback">B-Quik</span>
            </div>
            <div>
              <div class="fph-kicker">B-Quik Training Evaluation Report</div>
              <div class="fph-title">TRAINING EVALUATION SUMMARY REPORT: ${escapeHtml(m.courseTitle.toUpperCase())}</div>
              <div class="fph-subtitle">สรุปผลการประเมินความพึงพอใจและประสิทธิผลการฝึกอบรม แบ่งตามด้านและรุ่น</div>
            </div>
          </div>
          <div class="fph-right">
            <div class="fph-scope-pill">${escapeHtml(scopeText)}</div>
            <div class="fph-meta">ผู้ประเมิน: <strong>${sec.respondents} คน</strong> • พิมพ์เมื่อ: ${escapeHtml(m.generatedAt)}</div>
          </div>
        </div>
      `;
    }

    function buildFormalPdfFooter() {
      const m = REPORT_DATA.meta;
      return `
        <div class="formal-pdf-footer">
          <div>B-Quik Training &amp; Development | หลักสูตร ${escapeHtml(m.courseTitle)}</div>
          <div>พิมพ์รายงานเมื่อ: ${escapeHtml(m.generatedAt)}</div>
        </div>
      `;
    }

    function buildCompactBenchmarkBar(highlightId, hideWhenPrinting) {
      const ov = REPORT_DATA.overall;
      const cohorts = REPORT_DATA.cohorts;
      const hideClass = hideWhenPrinting ? 'benchmark-cohort-only-screen' : '';

      return `
        <div class="benchmark-card ${hideClass}">
          <div class="bm-summary">
            <div class="bm-eyebrow">ภาพรวมทุกรุ่น (OVERALL BENCHMARK)</div>
            <div class="bm-big-score">${ov.overallMean.toFixed(2)} <span>/ 5.00</span></div>
            <div class="bm-subtext">ความพึงพอใจ <strong>${ov.overallPercent}%</strong> • จาก ${ov.respondents} คน</div>
          </div>

          <div class="bm-chart-wrap">
            <div class="bm-chart-header">
              <span>เปรียบเทียบคะแนนเฉลี่ยแต่ละรุ่นตามลำดับวันที่ (${cohorts.length} รุ่น)</span>
              <span class="no-print" style="color:#71717A;">คลิกที่รุ่นเพื่อสลับดูข้อมูล</span>
            </div>
            <div class="bm-bars-row">
              ${cohorts.map(c => {
                const isSelected = (c.id === highlightId) ? 'is-selected' : '';
                return `
                  <div class="bm-col-item ${isSelected}" onclick="selectTab('${c.id}')">
                    <div class="bm-col-top">
                      <span class="bm-col-name">${escapeHtml(c.tabShortTitle)}</span>
                      <span class="bm-col-val">${c.overallMean.toFixed(2)}</span>
                    </div>
                    <div class="bm-mini-track">
                      <div class="bm-mini-fill" style="width:${c.overallPercent}%;"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function buildCohortBodyHTML(sec, isOverallSummary) {
      const ov = REPORT_DATA.overall;
      const d1 = sec.dimension1;
      const d2 = sec.dimension2;
      const d3 = sec.dimension3;
      const d4 = sec.dimension4;

      return `
        <div class="section-header">
          <div>
            <h1>${escapeHtml(sec.badgeTitle)} — ${escapeHtml(REPORT_DATA.meta.courseTitle)}</h1>
            <div class="date-sub">วันที่อบรม: <strong>${escapeHtml(sec.dateLabel)}</strong></div>
          </div>
          <div class="respondent-pill">ผู้ประเมิน ${sec.respondents} คน</div>
        </div>

        <div class="kpi-row">
          <div class="kpi-box featured">
            <div class="kpi-title">คะแนนเฉลี่ยรวม</div>
            <div class="kpi-number-row">
              <div class="kpi-number">${sec.overallMean.toFixed(2)}</div>
              ${renderDiffTag(sec.overallMean, ov.overallMean, isOverallSummary)}
            </div>
            <div class="kpi-foot">ร้อยละ ${sec.overallPercent}% (ระดับ${sec.satisfactionLevel})</div>
          </div>

          <div class="kpi-box">
            <div class="kpi-title">ด้านที่ 1: การบรรยายและวิทยากร</div>
            <div class="kpi-number-row">
              <div class="kpi-number">${d1.summary.mean.toFixed(2)}</div>
              ${renderDiffTag(d1.summary.mean, ov.dimension1.summary.mean, isOverallSummary)}
            </div>
            <div class="kpi-foot">SD ${d1.summary.sd.toFixed(2)} • ร้อยละ ${d1.summary.percent}%</div>
          </div>

          <div class="kpi-box">
            <div class="kpi-title">ด้านที่ 2: ความรู้และทักษะ</div>
            <div class="kpi-number-row">
              <div class="kpi-number">${d2.summary.mean.toFixed(2)}</div>
              ${renderDiffTag(d2.summary.mean, ov.dimension2.summary.mean, isOverallSummary)}
            </div>
            <div class="kpi-foot">SD ${d2.summary.sd.toFixed(2)} • ร้อยละ ${d2.summary.percent}%</div>
          </div>

          <div class="kpi-box">
            <div class="kpi-title">พัฒนาการความรู้ (ก่อน → หลัง)</div>
            <div class="kpi-number-row">
              <div class="kpi-number" style="color:#16A34A;">+${d2.prePost.gain.toFixed(2)}</div>
              <span class="tag-diff tag-pos">+${d2.prePost.gainPct}%</span>
            </div>
            <div class="kpi-foot">ก่อน ${d2.prePost.preMean.toFixed(2)} → หลัง ${d2.prePost.postMean.toFixed(2)}</div>
          </div>
        </div>

        <div class="grid-2col">
          ${renderCleanDimensionCard(d1, ov.dimension1, null, isOverallSummary)}
          ${renderCleanDimensionCard(d2, ov.dimension2, d2.prePost, isOverallSummary)}
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">${escapeHtml(d3.title)}</div>
            <div class="card-avg">ฐานผู้ตอบ ${sec.respondents} คน</div>
          </div>
          <div class="mod-list">
            ${d3.ranking.map((m, idx) => `
              <div class="mod-item">
                <div class="mod-top">
                  <span><span class="mod-rank">${idx + 1}.</span>${escapeHtml(m.shortName)}</span>
                  <span><strong>${m.count} คน</strong> <span style="color:#71717A;">(${m.percentOfRespondents}%)</span></span>
                </div>
                <div class="clean-track">
                  <div class="clean-fill" style="width:${Math.min(100, m.percentOfRespondents)}%; background:${idx === 0 ? '#FFD100' : '#141416'};"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">${escapeHtml(d4.title)}</div>
            <div class="card-avg">สรุป 3 ประเด็น</div>
          </div>
          <div class="qual-cols">
            ${renderCommentCol('สิ่งที่ได้รับจากการอบรม', d4.takeaways)}
            ${renderCommentCol('ประเด็นสำคัญสำหรับพนักงานสาขา', d4.branchPriorities)}
            ${renderCommentCol('ข้อเสนอแนะเพิ่มเติม', d4.suggestions)}
          </div>
        </div>
      `;
    }

    function renderCleanDimensionCard(dim, overallDim, prePostObj, isOverallSummary) {
      let prePostHTML = '';
      if (prePostObj) {
        prePostHTML = `
          <div class="prepost-minimal">
            <span>ความรู้ความเข้าใจ: ก่อนอบรม <strong>${prePostObj.preMean.toFixed(2)}</strong> → หลังอบรม <strong>${prePostObj.postMean.toFixed(2)}</strong></span>
            <strong>เพิ่มขึ้น +${prePostObj.gain.toFixed(2)} (+${prePostObj.gainPct}%)</strong>
          </div>
        `;
      }

      return `
        <div class="card">
          <div class="card-head">
            <div class="card-title">${escapeHtml(dim.title)}</div>
            <div class="card-avg">${dim.summary.mean.toFixed(2)} / 5.00</div>
          </div>

          <div class="metric-list">
            ${dim.items.map((item, idx) => {
              const ovItem = overallDim.items[idx];
              const ovPct = ovItem ? ovItem.percent : 0;
              return `
                <div class="metric-item">
                  <div class="metric-top">
                    <span class="metric-label">${escapeHtml(item.label)}</span>
                    <span class="metric-val">${item.mean.toFixed(2)} <small>(${item.percent}%)</small></span>
                  </div>
                  <div class="clean-track" title="คะแนนข้อนี้ ${item.mean.toFixed(2)} | ขีดสีแดง = ค่าเฉลี่ยภาพรวม ${ovItem ? ovItem.mean.toFixed(2) : '-'}">
                    ${!isOverallSummary ? `<div class="benchmark-pin" style="left:${ovPct}%;"></div>` : ''}
                    <div class="clean-fill" style="width:${item.percent}%;"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          ${prePostHTML}
        </div>
      `;
    }

    function renderDiffTag(val, benchmarkVal, isOverallSummary) {
      if (isOverallSummary) return '';
      const diff = Number((val - benchmarkVal).toFixed(2));
      if (diff > 0) return `<span class="tag-diff tag-pos">+${diff.toFixed(2)}</span>`;
      if (diff < 0) return `<span class="tag-diff tag-neg">${diff.toFixed(2)}</span>`;
      return `<span class="tag-diff tag-neu">0.00</span>`;
    }

    function renderCommentCol(title, list) {
      if (!list || list.length === 0) {
        return `
          <div class="qual-col">
            <h4>${escapeHtml(title)} (0)</h4>
            <div style="font-size:12px; color:#71717A;">ไม่มีข้อเสนอแนะ</div>
          </div>
        `;
      }

      const limit = 6;
      const hasMore = list.length > limit;
      const remainCount = list.length - limit;

      return `
        <div class="qual-col">
          <h4>${escapeHtml(title)} (${list.length})</h4>
          <div class="comment-chips">
            ${list.map((c, idx) => `
              <span class="chip ${idx >= limit ? 'hidden-chip' : ''}">${escapeHtml(c.text)}</span>
            `).join('')}
          </div>
          ${hasMore ? `<button class="toggle-more-btn" onclick="toggleComments(this, ${remainCount})">+ ดูทั้งหมดอีก ${remainCount} รายการ</button>` : ''}
          ${hasMore ? `<div class="print-only-more-note">+ และอีก ${remainCount} รายการ</div>` : ''}
        </div>
      `;
    }

    function toggleComments(btn, hiddenCount) {
      const col = btn.closest('.qual-col');
      const isExpanded = col.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'ย่อรายการ' : `+ ดูทั้งหมดอีก ${hiddenCount} รายการ`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
